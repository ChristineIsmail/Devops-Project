apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: devops-app-vs
spec:
  hosts:
    - "*"
  gateways:
    - devops-app-gateway
  http:
    - route:
        - destination:
            host: devops-app-service
            subset: v1
          weight: 80
        - destination:
            host: devops-app-service
            subset: v2
          weight: 20
